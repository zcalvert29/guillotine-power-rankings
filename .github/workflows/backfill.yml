name: Rebuild track record

on:
  workflow_dispatch:      # run once (or again any time) to rebuild past weeks
    inputs:
      force:
        description: "Rebuild every past week, even ones that already have a snapshot"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install numpy
      - name: Rebuild past weeks
        env:
          LEAGUE_ID: ${{ vars.LEAGUE_ID || '1389750406673883136' }}
        run: python -m pipeline.backfill ${{ inputs.force && '--force' || '' }}
      - name: Commit
        run: |
          git config user.name "guillotine-bot"
          git config user.email "guillotine-bot@users.noreply.github.com"
          git add history/ snapshots/
          git diff --cached --quiet || git commit -m "Rebuild track record"
          git pull --rebase origin main
          git push
