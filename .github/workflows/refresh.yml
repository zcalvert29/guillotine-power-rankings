name: Daily refresh

on:
  schedule:
    - cron: "17 11 * * *"   # every day ~5:17 AM Central, after overnight waivers process
  workflow_dispatch: {}      # "Run workflow" button for an on-demand refresh

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install numpy
      - name: Pull league and simulate
        env:
          LEAGUE_ID: ${{ vars.LEAGUE_ID || '1389750406673883136' }}
          N_SIMS: ${{ vars.N_SIMS || '10000' }}
        run: python -m pipeline.run
      - name: Grade finished weeks
        env:
          LEAGUE_ID: ${{ vars.LEAGUE_ID || '1389750406673883136' }}
        run: python -m pipeline.backfill
      - name: Commit snapshot
        run: |
          git config user.name "guillotine-bot"
          git config user.email "guillotine-bot@users.noreply.github.com"
          git add snapshots/ history/
          git diff --cached --quiet || git commit -m "Snapshot $(TZ=America/Chicago date +%F)"
          git push
